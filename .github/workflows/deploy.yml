name: Deploy

# Deploys the client to the lysterfield-lake Worker
# (lysterfieldlake.com, and its workers.dev URL: the built site as static
# assets, and the polaroid API, apps/client/wrangler.jsonc) when main changes,
# as `bun run --cwd apps/client deploy` does by hand. Its videos aren't
# part of the build: they're in the lysterfield-lake-next-dreams R2 bucket,
# served from next-dreams.lysterfieldlake.com (apps/client/.env.production).
#
# It builds from the committed src/dreams.json, without the deploy script's
# `generate` step, which reads the gitignored dreams/ folder that only
# exists on a machine with the videos.
#
# Needs two repo secrets: CLOUDFLARE_API_TOKEN (a token with Workers Scripts:
# Edit on the account, plus D1: Edit and Workers R2 Storage: Edit for the
# Worker's bindings) and CLOUDFLARE_ACCOUNT_ID. D1 migrations
# (apps/client/migrations) aren't applied here: run
# `wrangler d1 migrations apply lysterfield-polaroids --remote` by hand
# before merging one.

on:
  push:
    branches: [main]
    paths:
      - apps/client/**
      - bun.lock
      - .github/workflows/deploy.yml
  workflow_dispatch:

# One at a time, the newest winning: a push mid-deploy replaces it.
concurrency:
  group: deploy
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10

      - run: bun install --frozen-lockfile

      - name: Build
        run: bun run --cwd apps/client build

      - name: Deploy the Worker
        working-directory: apps/client
        run: bunx wrangler deploy --message "${{ github.sha }}"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
