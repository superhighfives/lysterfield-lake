# Deforum 0.7.1 (deforum/, fetched by fetch.sh) with the legacy dreams' render.py.
# Package pins are upstream 0.7.1's own cog.yaml (minus an unavailable triton dev build), plus safetensors. Weights (Protogen V2.2,
# MiDaS, AdaBins; ~6GB) are downloaded in setup() with pget, not baked in, to keep the image
# small: a large GPU image is what kept models/outline stuck in "starting" on Replicate.
build:
  gpu: true
  python_version: "3.10"
  system_packages:
    - "libgl1-mesa-glx"
    - "libglib2.0-0"
    - "ffmpeg"
  run:
    # Packages are installed here rather than via python_requirements: Cog 0.21's requirements
    # step runs `uv run pip install`, which uv's own managed Python refuses (PEP 668). These are
    # upstream 0.7.1's pins (minus an unavailable triton dev build) + safetensors, torch from cu116,
    # and pydantic (helpers/prompts.py needs it; older Cog shipped it, 0.21 doesn't).
    - uv pip install --system --break-system-packages --index-strategy unsafe-best-match --extra-index-url https://download.pytorch.org/whl/cu116 "ipython==8.10.0" "pandas==1.4.4" "scikit-image==0.19.3" "clean_fid==0.1.35" "torch==1.12.1+cu116" "torchvision==0.13.1+cu116" "ftfy==6.1.1" "scipy==1.10.0" "transformers==4.26.1" "omegaconf==2.3.0" "einops==0.4.1" "pytorch-lightning==1.7.7" "torchmetrics==0.11.1" "kornia==0.6" "accelerate==0.16.0" "jsonmerge==1.9.0" "resize-right==0.0.2" "torchdiffeq==0.2.3" "opencv-python==4.7.0.68" "numpngw==0.1.2" "open-clip-torch==2.13.0" "torchsde==0.2.5" "scikit-learn==1.2.1" "matplotlib==3.6.3" "numexpr==2.8.4" "safetensors==0.3.1" "pydantic==1.10.13"
    # Fetched at build time, not mid-run. Deforum's depth model (AdaBins) builds its encoder with
    # torch.hub from GitHub, and its aesthetics guidance downloads a small model from GitHub, both on
    # every new container: a GitHub 500 then failed the prediction six seconds in (2026-10-13). The
    # hub repo and the aesthetics model are pinned to commits; the ImageNet weights are what the hub
    # repo downloads on first use.
    - mkdir -p /opt/torch-hub /opt/deforum-models && curl -sfL https://github.com/rwightman/gen-efficientnet-pytorch/archive/771ce082b2ce6d033f55b3d47c1f77389ad3c180.tar.gz | tar xz -C /opt/torch-hub && mv /opt/torch-hub/gen-efficientnet-pytorch-771ce082b2ce6d033f55b3d47c1f77389ad3c180 /opt/torch-hub/gen-efficientnet-pytorch
    - TORCH_HOME=/opt/torch-home python -c "import torch; torch.hub.load('/opt/torch-hub/gen-efficientnet-pytorch', 'tf_efficientnet_b5_ap', source='local', pretrained=True)"
    - curl -sfL -o /opt/deforum-models/sac_public_2022_06_29_vit_l_14_linear.pth https://github.com/crowsonkb/simulacra-aesthetic-models/raw/701f7678b305acf8a0634350365a86beb95dd87d/models/sac_public_2022_06_29_vit_l_14_linear.pth
    - curl -o /usr/local/bin/pget -L "https://github.com/replicate/pget/releases/download/v0.8.2/pget_linux_x86_64" && chmod +x /usr/local/bin/pget
predict: "predict.py:Predictor"
