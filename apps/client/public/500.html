<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Something went wrong • Lysterfield Lake</title>
    <meta name="title" content="Something went wrong • Lysterfield Lake" />
    <meta name="description" content="Something went wrong." />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" href="/favicon.ico" />
    <!-- The site's theme before first paint (same 'theme' key as
         src/utils/theme.ts). -->
    <script>
      ;(function () {
        var preference = null
        try {
          preference = localStorage.getItem('theme')
        } catch (e) {}
        var dark =
          preference === 'dark' ||
          (preference !== 'light' &&
            window.matchMedia('(prefers-color-scheme: dark)').matches)
        if (dark) document.documentElement.classList.add('dark')
      })()
    </script>
    <link rel="stylesheet" href="/error.css" />
  </head>
  <body>
    <div class="fireflies" aria-hidden="true"></div>
    <main class="error">
      <div class="error__print" aria-hidden="true">
        <div class="error__photo"><div class="error__grain"></div></div>
        <div class="error__code">500</div>
      </div>
      <div>
        <h1 class="error__message">Something went under.</h1>
        <p class="error__detail">It should be back in a moment.</p>
      </div>
      <div class="error__actions">
        <button class="error__button error__button--quiet" type="button" onclick="top.location.reload()">Try again</button>
        <a class="error__button" href="/" target="_top">Back to <span>Lysterfield Lake</span></a>
      </div>
    </main>
    <script src="/error.js"></script>
  </body>
</html>
