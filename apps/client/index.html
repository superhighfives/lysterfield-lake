<!doctype html>
<html lang="en">
  <head>
    <script
      async
      src="https://www.googletagmanager.com/gtag/js?id=G-P62C4N4GG0"
    ></script>
    <script>
      window.dataLayer = window.dataLayer || []
      function gtag() {
        dataLayer.push(arguments)
      }
      gtag('js', new Date())
      gtag('config', 'G-P62C4N4GG0')
    </script>

    <meta charset="UTF-8" />
    <meta name="color-scheme" content="light dark" />

    <!-- Applies the dark theme before first paint, so a dark-mode visit
         doesn't flash the light background while the bundle loads. Mirrors
         src/utils/theme.ts (same 'theme' storage key), which takes over
         once React mounts. -->
    <script>
      ;(function () {
        var preference = null
        try {
          preference = localStorage.getItem('theme')
        } catch (e) {}
        var dark =
          preference === 'dark' ||
          (preference !== 'light' &&
            window.matchMedia('(prefers-color-scheme: dark)').matches)
        if (dark) document.documentElement.classList.add('dark')
        document.documentElement.style.colorScheme = dark ? 'dark' : 'light'
      })()
    </script>
    <!-- viewport-fit=cover: on iPhone the page runs on behind Safari's
         toolbar (and the status bar, launched from the home screen),
         rather than stopping short; what's pinned to the edges keeps
         clear with env(safe-area-inset-*). -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <!-- Added to the home screen, it runs full screen, with the status bar
         drawn over the page (in a Safari tab, iOS keeps its status bar
         area to itself, tinted to the page, for a page that doesn't
         scroll). -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="Lysterfield Lake" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter&family=Space+Mono:wght@400;700&display=swap"
      rel="stylesheet"
    />

    <!-- Primary Meta Tags -->
    <title>%VITE_APP_TITLE%</title>
    <meta name="title" content="%VITE_APP_TITLE%" />
    <meta name="description" content="%VITE_APP_DESCRIPTION%" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" href="/favicon.ico" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="%VITE_APP_URL%" />
    <meta property="og:title" content="%VITE_APP_TITLE%" />
    <meta property="og:description" content="%VITE_APP_DESCRIPTION%" />
    <meta property="og:image" content="%VITE_APP_IMAGE%" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="%VITE_APP_URL%" />
    <meta property="twitter:title" content="%VITE_APP_TITLE%" />
    <meta property="twitter:description" content="%VITE_APP_DESCRIPTION%" />
    <meta property="twitter:image" content="%VITE_APP_IMAGE%" />

    <style>
      .boot-spinner {
        position: fixed;
        top: 50%;
        left: 50%;
        width: 28px;
        height: 28px;
        margin: -14px 0 0 -14px;
        box-sizing: border-box;
        border-radius: 9999px;
        border: 2px solid #d6d3d1;
        border-top-color: #78716c;
      }
      .dark .boot-spinner {
        border-color: #44403c;
        border-top-color: #a8a29e;
      }
      @media (prefers-reduced-motion: no-preference) {
        .boot-spinner {
          animation: boot-spin 1s linear infinite;
        }
      }
      @keyframes boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body class="text-stone-900 dark:text-stone-100">
    <!-- The spinner until the app's code has loaded and rendered over it:
         the same ring as src/components/spinner.tsx, styled inline since
         the app's stylesheet may not have arrived yet. -->
    <div id="root">
      <div class="boot-spinner"></div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
