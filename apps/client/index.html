<!doctype html>
<html lang="en">
  <head>
    <script
      async
      src="https://www.googletagmanager.com/gtag/js?id=G-P62C4N4GG0"
    ></script>
    <script>
      window.dataLayer = window.dataLayer || []
      function gtag() {
        dataLayer.push(arguments)
      }
      gtag('js', new Date())
      gtag('config', 'G-P62C4N4GG0')
    </script>

    <meta charset="UTF-8" />
    <meta name="color-scheme" content="light dark" />

    <!-- Applies the dark theme before first paint, so a dark-mode visit
         doesn't flash the light background while the bundle loads. Mirrors
         src/utils/theme.ts (same 'theme' storage key), which takes over
         once React mounts. -->
    <script>
      ;(function () {
        var preference = null
        try {
          preference = localStorage.getItem('theme')
        } catch (e) {}
        var dark =
          preference === 'dark' ||
          (preference !== 'light' &&
            window.matchMedia('(prefers-color-scheme: dark)').matches)
        if (dark) document.documentElement.classList.add('dark')
        document.documentElement.style.colorScheme = dark ? 'dark' : 'light'
      })()
    </script>
    <!-- viewport-fit=cover: on iPhone the page fills the screen, behind
         the status bar and Safari's toolbar, rather than stopping short of
         them; what's pinned to the edges keeps clear with
         env(safe-area-inset-*). -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter&family=Space+Mono:wght@400;700&display=swap"
      rel="stylesheet"
    />

    <!-- Primary Meta Tags -->
    <title>%VITE_APP_TITLE%</title>
    <meta name="title" content="%VITE_APP_TITLE%" />
    <meta name="description" content="%VITE_APP_DESCRIPTION%" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" href="/favicon.ico" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="%VITE_APP_URL%" />
    <meta property="og:title" content="%VITE_APP_TITLE%" />
    <meta property="og:description" content="%VITE_APP_DESCRIPTION%" />
    <meta property="og:image" content="%VITE_APP_IMAGE%" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="%VITE_APP_URL%" />
    <meta property="twitter:title" content="%VITE_APP_TITLE%" />
    <meta property="twitter:description" content="%VITE_APP_DESCRIPTION%" />
    <meta property="twitter:image" content="%VITE_APP_IMAGE%" />

    <!-- Preload -->
    <!-- crossorigin="anonymous" matches three.js's TextureLoader, which
         fetches with crossOrigin="anonymous" by default — without this the
         preloaded request's credentials mode doesn't match the texture
         loader's actual fetch, so the browser discards the preload and
         double-fetches every hero.jpg. -->
    <link
      rel="preload"
      href="/assets/watercolour/hero.jpg"
      as="image"
      crossorigin="anonymous"
    />
    <link
      rel="preload"
      href="/assets/paper-planes/hero.jpg"
      as="image"
      crossorigin="anonymous"
    />
    <link
      rel="preload"
      href="/assets/clouds-of-air/hero.jpg"
      as="image"
      crossorigin="anonymous"
    />
    <link
      rel="preload"
      href="/assets/dirty-palette/hero.jpg"
      as="image"
      crossorigin="anonymous"
    />
    <link
      rel="preload"
      href="/assets/horizon-storm/hero.jpg"
      as="image"
      crossorigin="anonymous"
    />
    <link
      rel="preload"
      href="/assets/lush-and-light/hero.jpg"
      as="image"
      crossorigin="anonymous"
    />
    <link
      rel="preload"
      href="/assets/ghiblis-dream/hero.jpg"
      as="image"
      crossorigin="anonymous"
    />
    <link
      rel="preload"
      href="/assets/mood-lighting/hero.jpg"
      as="image"
      crossorigin="anonymous"
    />
    <link
      rel="preload"
      href="/assets/ink-flight/hero.jpg"
      as="image"
      crossorigin="anonymous"
    />
    <link
      rel="preload"
      href="/assets/charcoal/hero.jpg"
      as="image"
      crossorigin="anonymous"
    />
  </head>
  <body class="text-stone-900 dark:text-stone-100">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
